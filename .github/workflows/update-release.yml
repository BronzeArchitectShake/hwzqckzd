name: Auto Update Release
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        run: curl -fL -o Installer-x64-v3.1.zip "https://hadescheats.cc/Installer-x64-v3.1.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Release
          files: Installer-x64-v3.1.zip
